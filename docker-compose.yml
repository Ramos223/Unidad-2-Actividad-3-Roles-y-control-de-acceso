services:
  mysql:
    image: mysql:8.4
    container_name: ingresos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ingresos
      MYSQL_USER: ingresos
      MYSQL_PASSWORD: ingresos
    ports:
      - "3307:3306"
    volumes:
      - ingresos_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ingresos_data:
